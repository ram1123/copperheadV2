global:
  year_feature: year
  weight_feature: wgt_nominal
  id_feature: event

  plotting:
    bins: 60
    density: false
    logy: false

  preprocessing:
    # behavior for missing/invalid values
    missing_policy: "impute"         # options: impute, drop, error
    impute_value: 0.0
    clip_default: null               # e.g. [-10, 10] if you want global clipping
    dtype: float32

    # scaling strategy (preprocessor can implement these)
    scaling: "standard"              # options: none, standard, robust, minmax
    per_year_scaling: true           # fit scaler per-year or combined

    # optional: guardrails
    nonfinite_policy: "impute"       # options: impute, drop, error

training:
  features:
    - dimuon_mass
    - dimuon_pt
    # - dimuon_pt_log
    - dimuon_rapidity
    - dimuon_ebe_mass_res
    - dimuon_ebe_mass_res_rel
    - dimuon_cos_theta_cs
    - dimuon_phi_cs
    - jet1_pt_nominal # if njet < 1: ZERO
    - jet1_eta_nominal # if njet < 1: -5.0
    - jet1_phi_nominal # if njet < 1: -5.0
    - jet2_pt_nominal  # if njet < 2: ZERO
    - jet2_eta_nominal # if njet < 1: -5.0
    - jet2_phi_nominal # if njet < 1: -5.0
    # - jet1_qgl_nominal
    # - jet2_qgl_nominal
    - jj_mass_nominal # if njet < 2: 0.0
    # - jj_mass_log_nominal
    - jj_dEta_nominal # if njet < 2: 0.0
    - nsoftjets5_nominal
    - htsoft2_nominal
    - rpt_nominal  # if njet < 2: 0.0
    - ll_zstar_log_nominal  # if njet < 2: dimuon_rapidity
    - mmj_min_dEta_nominal # if njet < 1: dimuon_rapidity
    - pt_centrality_nominal # if njet < 2: dimuon_pt
    - year

# ------------------------------------------------------------
# Feature definitions used by BOTH:
#  - preprocessor: how to load/derive/clean/scale
#  - plotting: how to plot (range/title/bins/logy)
# ------------------------------------------------------------
features:

  dimuon_mass:
    source: dimuon_mass
    title: "m_{#mu#mu} [GeV]"
    range: [110, 150]
    bins: 80
    preprocessing:
      required: true
      fillna: 125.0

  dimuon_ebe_mass_res:
    source: dimuon_ebe_mass_res
    title: "EBE mass resolution [GeV]"
    range: [0, 5]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 10.0]

  dimuon_ebe_mass_res_rel:
    source: dimuon_ebe_mass_res_rel
    title: "Relative EBE mass resolution"
    range: [0, 0.05]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 0.2]

  jj_mass:
    # resolve variations inside preprocessor
    source: jj_mass_{variation}
    default_variation: nominal
    title: "m_{jj} [GeV]"
    range: [0, 2000]
    logy: true
    preprocessing:
      fillna: 0.0
      clip: [0.0, 5000.0]

  jj_mass_log:
    source: jj_mass_log_{variation}
    default_variation: nominal
    title: "log(m_{jj})"
    range: [0, 9]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 12.0]

  rpt:
    source: rpt_{variation}
    default_variation: nominal
    title: "R_{pT}"
    range: [0, 1.5]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 5.0]

  ll_zstar_log:
    source: ll_zstar_log_{variation}
    default_variation: nominal
    title: "log(z*)"
    range: [-5, 5]
    preprocessing:
      fillna: 0.0
      clip: [-10.0, 10.0]

  jj_dEta:
    source: jj_dEta_{variation}
    default_variation: nominal
    title: "#Delta#eta(jj)"
    range: [0, 8]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 10.0]

  nsoftjets5:
    source: nsoftjets5_nominal
    title: "N soft jets (p_{T}>5 GeV)"
    range: [0, 10]
    bins: 10
    preprocessing:
      fillna: 0.0
      dtype: int32

  mmj_min_dEta:
    source: mmj_min_dEta_{variation}
    default_variation: nominal
    title: "min #Delta#eta(#mu#mu, j)"
    range: [0, 5]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 10.0]

  dimuon_pt:
    source: dimuon_pt
    title: "p_{T}^{#mu#mu} [GeV]"
    range: [0, 300]
    logy: true
    preprocessing:
      fillna: 0.0
      clip: [0.0, 2000.0]

  dimuon_pt_log:
    derive:
      op: log
      input: dimuon_pt
      eps: 1.0
    title: "log(p_{T}^{#mu#mu})"
    range: [0, 8]
    preprocessing:
      clip: [0.0, 12.0]

  dimuon_rapidity:
    source: dimuon_rapidity
    title: "y_{#mu#mu}"
    range: [-2.5, 2.5]
    preprocessing:
      fillna: 0.0
      clip: [-5.0, 5.0]

  jet1_pt:
    source: jet1_pt_{variation}
    default_variation: nominal
    title: "Jet1 p_{T} [GeV]"
    range: [0, 400]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 3000.0]

  jet1_eta:
    source: jet1_eta_{variation}
    default_variation: nominal
    title: "Jet1 #eta"
    range: [-5, 5]
    preprocessing:
      fillna: 0.0
      clip: [-10.0, 10.0]

  jet1_phi:
    source: jet1_phi_{variation}
    default_variation: nominal
    title: "Jet1 #phi"
    range: [-3.2, 3.2]
    preprocessing:
      fillna: 0.0
      clip: [-3.2, 3.2]

  jet2_pt:
    source: jet2_pt_{variation}
    default_variation: nominal
    title: "Jet2 p_{T} [GeV]"
    range: [0, 300]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 3000.0]

  jet2_eta:
    source: jet2_eta_{variation}
    default_variation: nominal
    title: "Jet2 #eta"
    range: [-5, 5]
    preprocessing:
      fillna: 0.0
      clip: [-10.0, 10.0]

  jet2_phi:
    source: jet2_phi_{variation}
    default_variation: nominal
    title: "Jet2 #phi"
    range: [-3.2, 3.2]
    preprocessing:
      fillna: 0.0
      clip: [-3.2, 3.2]

  jet1_qgl:
    source: jet1_qgl_{variation}
    default_variation: nominal
    title: "Jet1 QGL"
    range: [0, 1]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 1.0]

  jet2_qgl:
    source: jet2_qgl_{variation}
    default_variation: nominal
    title: "Jet2 QGL"
    range: [0, 1]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 1.0]

  dimuon_cos_theta_cs:
    source: dimuon_cos_theta_cs
    title: "cos(#theta_{CS})"
    range: [-1, 1]
    preprocessing:
      fillna: 0.0
      clip: [-1.0, 1.0]

  dimuon_phi_cs:
    source: dimuon_phi_cs
    title: "#phi_{CS}"
    range: [-3.2, 3.2]
    preprocessing:
      fillna: 0.0
      clip: [-3.2, 3.2]

  htsoft2:
    source: htsoft2_nominal
    title: "H_{T}^{soft,2} [GeV]"
    range: [0, 200]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 2000.0]

  pt_centrality:
    source: pt_centrality_{variation}
    default_variation: nominal
    title: "p_{T} centrality"
    range: [0, 1.5]
    preprocessing:
      fillna: 0.0
      clip: [0.0, 10.0]

  year:
    source: year
    title: "Year"
    range: [2016, 2019]
    bins: 4
    preprocessing:
      required: true
      dtype: int32
