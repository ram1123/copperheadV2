[workspace]
authors = ["ram1123 <ramkrishna.sharma71@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "copperhead-analysis"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.4"

[tasks]
list-tasks = "pixi task list"
check = "python -c 'import coffea, awkward, uproot; print(\"Stack Ready\")'"
lint = "ruff check ."
# format = "ruff format ."
stage1 = "snakemake -s workflow/Snakefile -j 4 --resources gateway=1 --rerun-incomplete --restart-times 3 --latency-wait 60 "
plot = "snakemake -s workflow/Snakefile plot_all  -j 3 --resources gateway=1 --rerun-incomplete --restart-times 3 --latency-wait 60 --allowed-rules plots  -R plots --forceall "
unlock = "snakemake -s workflow/Snakefile --unlock"
stage2 = "bash stage2_sh.sh all all"

# ----------------------------------------------------------------------
# Core analysis stack: needed for stage-prestage/stage1
# ----------------------------------------------------------------------
[feature.analysis.dependencies]
python = ">=3.11,<3.12"
coffea = "==2024.11.0"
awkward = "*"
uproot = "*"
hist = "*"
uncertainties = "*"
lmfit = "*"
correctionlib = "==2.6.4"
dask = "*"
dask-gateway = "*"
dask-awkward = "==2025.5.0"
xrootd = "*"
omegaconf = "*"
numpy = "*"
scipy = "==1.14.1"
scikit-learn = ">=1.4,<1.6"
matplotlib = "*"
plotly = "*"
mplhep = "*"
pandas = "*"
pyarrow = "*"
tqdm = "*"
fsspec-xrootd = "*"
rucio-clients = "*"
mpmath = "<=1.3"
sympy = "*"
rsync = ">=3.3.0,<4"
ripgrep = ">=15.1.0,<16"
pytz = "*"

# ----------------------------------------------------------------------
# ROOT / HEP extras
# ----------------------------------------------------------------------
[feature.root.dependencies]
root = "==6.32.2"
hepconvert = "*"
scikit-hep-testdata = "*"

# ----------------------------------------------------------------------
# Higgs Combine
# ----------------------------------------------------------------------
[feature.combine.dependencies]
cms-combine = "==10.4.2"
root = "6.36.*"

# ----------------------------------------------------------------------
# ML / training
# ----------------------------------------------------------------------
[feature.ml.dependencies]
xgboost = "*"
pytorch = "2.5.*"
ax-platform = ">=1.2.1,<2"
optuna = ">=4.7.0,<5"
shap = ">=0.50.0,<0.51"

# ----------------------------------------------------------------------
# Dev / notebooks
# ----------------------------------------------------------------------
[feature.dev.dependencies]
ipywidgets = "*"
ipykernel = "*"
seaborn = "*"
ruff = ">=0.15.5,<0.16"
graphviz = "*"

# ----------------------------------------------------------------------
# Symbolic regression
# ----------------------------------------------------------------------
[feature.symbolic.dependencies]
julia = ">=1.9,<1.12"
pysr = "*"

[feature.symbolic.pypi-dependencies]
juliacall = "*"

# ----------------------------------------------------------------------
# Workflow tools
# ----------------------------------------------------------------------
[feature.workflow.dependencies]
snakemake-minimal = ">=9.16.3,<10"

# ----------------------------------------------------------------------
# CUDA helpers
# ----------------------------------------------------------------------
[feature.cuda.dependencies]
libnvjitlink-dev = "*"

# ----------------------------------------------------------------------
# Style helpers
# ----------------------------------------------------------------------
[feature.style.pypi-dependencies]
cmsstyle = "*"

# ----------------------------------------------------------------------
# Local activation
# ----------------------------------------------------------------------
[feature.local.activation]
scripts = ["scripts/pixi_activate.sh"]

# ----------------------------------------------------------------------
# Environments
# ----------------------------------------------------------------------
[environments]
# Minimal CI environment for GitHub Actions sync tests
ci = ["analysis"]

default = ["analysis", "dev", "root", "workflow", "style", "local", "ml"]

# Full heavy environment with ML + symbolic tools
full = ["analysis", "dev", "root", "ml", "symbolic", "workflow", "style", "cuda", "local"]
symbolic = ["analysis", "symbolic", "dev", "style", "local"]
combine = ["analysis", "combine", "ml", "local", "style"]
