[workspace]
authors = ["ram1123 <ramkrishna.sharma71@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "copperhead-analysis"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[system-requirements]
cuda = "12.4"

[tasks]
list-tasks = "pixi task list"
check = "python -c 'import coffea, awkward, uproot; print(\"Stack Ready\")'"
lint = "ruff check ."
# format = "ruff format ."
stage1 = "snakemake -s workflow/Snakefile all_stage1 -j 4 --resources gateway=1 --rerun-incomplete --restart-times 3 --latency-wait 60 "
stage1full = "snakemake -s workflow/Snakefile -j 4 --resources gateway=1 --rerun-incomplete --restart-times 3 --latency-wait 60 "
plot = "snakemake -s workflow/Snakefile plot_all  -j 3 --resources gateway=1 --rerun-incomplete --restart-times 3 --latency-wait 60 --allowed-rules plots plot_all --forceall --config use_existing_stage1=True"
unlock = "snakemake -s workflow/Snakefile --unlock"
stage2 = "bash stage2_sh.sh all all"

# ----------------------------------------------------------------------
# Core analysis base stack: needed for stage-prestage/stage1
# ----------------------------------------------------------------------
[feature.analysis_base.dependencies]
python = ">=3.11,<3.12"
awkward = "*"
uproot = "*"
hist = "*"
uncertainties = "*"
lmfit = "*"
correctionlib = "==2.6.4"
dask = "*"
dask-gateway = "*"
xrootd = "*"
omegaconf = "*"
numpy = "*"
scipy = "==1.14.1"
scikit-learn = ">=1.4,<1.6"
matplotlib = "*"
plotly = "*"
mplhep = "*"
pandas = "*"
pyarrow = "*"
tqdm = "*"
fsspec-xrootd = "*"
rucio-clients = "*"
mpmath = "<=1.3"
sympy = "*"
rsync = ">=3.3.0,<4"
ripgrep = ">=15.1.0,<16"
pytz = "*"

# ----------------------------------------------------------------------
# Coffea version selectors
# ----------------------------------------------------------------------
[feature.coffea_legacy.dependencies]
coffea = "==2024.11.0"
dask-awkward = "==2025.5.0"

[feature.coffea_latest.dependencies]
coffea = "==2026.5.0"

# ----------------------------------------------------------------------
# ROOT / HEP extras
# ----------------------------------------------------------------------
[feature.root.target.linux-64.dependencies]
# ROOT for the main analysis stack. Keep this separate from the Combine stack
# because cms-combine requires a newer ROOT series.
root = "==6.32.2"
hepconvert = "*"
scikit-hep-testdata = "*"

# ----------------------------------------------------------------------
# Higgs Combine
# ----------------------------------------------------------------------
[feature.combine.target.linux-64.dependencies]
cms-combine = "==10.4.2"
# Kept in its own solve group because it is not compatible with the analysis ROOT pin.
root = "6.36.*"

# ----------------------------------------------------------------------
# ML / training
# ----------------------------------------------------------------------
[feature.ml.dependencies]
xgboost = "*"
pytorch = "2.5.*"
ax-platform = ">=1.2.1,<2"
optuna = ">=4.7.0,<5"
shap = ">=0.50.0,<0.51"

# ----------------------------------------------------------------------
# Dev / notebooks
# ----------------------------------------------------------------------
[feature.dev.dependencies]
ipywidgets = "*"
ipykernel = "*"
seaborn = "*"
ruff = ">=0.15.5,<0.16"
graphviz = "*"

# ----------------------------------------------------------------------
# Symbolic regression
# ----------------------------------------------------------------------
[feature.symbolic.target.linux-64.dependencies]
julia = ">=1.9,<1.12"
pysr = "*"

[feature.symbolic.target.linux-64.pypi-dependencies]
juliacall = "*"

# ----------------------------------------------------------------------
# Workflow tools
# ----------------------------------------------------------------------
[feature.workflow.dependencies]
snakemake-minimal = ">=9.16.3,<10"

# ----------------------------------------------------------------------
# CUDA helpers
# ----------------------------------------------------------------------
[feature.cuda.target.linux-64.dependencies]
libnvjitlink-dev = "*"

# ----------------------------------------------------------------------
# Style helpers
# ----------------------------------------------------------------------
[feature.style.pypi-dependencies]
cmsstyle = "*"

# ----------------------------------------------------------------------
# Local activation
# ----------------------------------------------------------------------
[feature.local.activation]
scripts = ["scripts/pixi_activate.sh"]

# ----------------------------------------------------------------------
# Environments
# ----------------------------------------------------------------------
[environments]
# Pixi still creates one runnable environment directory per named environment.
# Using solve groups here reduces duplicate solving work and keeps overlapping
# environments pinned together.
# Reference: https://pixi.prefix.dev/v0.21.0/features/multi_environment/

# Minimal CI environment for sync checks and lightweight validation.
ci-legacy = { features = ["analysis_base", "coffea_legacy"], solve-group = "ci-stack-legacy" }

# Same as ci, but with the latest coffea release line for migration work.
ci = { features = ["analysis_base", "coffea_latest"], solve-group = "ci-stack-latest" }

# Main day-to-day analysis environment, including symbolic regression and CUDA helpers.
default-legacy = { features = ["analysis_base", "coffea_legacy", "dev", "root", "ml", "symbolic", "workflow", "style", "cuda", "local"], solve-group = "analysis-stack-legacy" }

# Main analysis environment against the latest coffea release.
default = { features = ["analysis_base", "coffea_latest", "dev", "root", "ml", "symbolic", "workflow", "style", "cuda", "local"], solve-group = "analysis-stack-latest" }

# Kept in a separate solve group because the combine stack pins a different ROOT version.
combine-legacy = { features = ["analysis_base", "coffea_legacy", "combine", "ml", "style", "dev", "workflow", "local"], solve-group = "combine-stack-legacy" }

combine = { features = ["analysis_base", "coffea_latest", "combine", "ml", "style", "dev", "workflow", "local"], solve-group = "combine-stack-latest" }
