[workspace]
authors = ["ram1123 <ramkrishna.sharma71@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "coffea_latest_ml"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.4"

[tasks]

[dependencies]
python = "==3.12.9"
pip = "*"
coffea = "==2024.11.0"
awkward = "*"
uproot = "*"
hist = "*"
mplhep = "*"
uncertainties = "*"
lmfit = "*"
correctionlib = "==2.6.4"
hepconvert = "*"
root = "==6.32.2"
xgboost = "*"
dask = "*"
dask-gateway = "*"
dask-awkward = "==2025.5.0"
xrootd = "*"
ipywidgets = "*"
ipykernel = "*"
omegaconf = "*"
seaborn = "*"
libnvjitlink-dev = "*"
pytorch = "2.5.*"
scikit-learn = "*"
numpy = "*"
matplotlib = "*"
plotly = "*"
rucio-clients = "*"
fsspec-xrootd = "*"
snakemake-minimal = ">=9.16.3,<10"
mpmath = "<=1.3"
ax-platform = ">=1.2.1, <2"
shap = ">=0.50.0, <0.51"
graphviz = "*"
scikit-hep-testdata = "*"
scipy = "==1.14.1"
rsync = ">=3.3.0,<4"

[pypi-dependencies]
cmsstyle = "*"

[activation]
scripts = ["scripts/pixi_activate.sh"]
