meta:
  seed: 12345
  device: "cuda"          # "cuda" or "cpu"
  dtype: "float32"

analysis:
  category: "vbf"
  region: "h-peak"
  year_mode: "feature"
  year_feature_name: "year"

data:
  mode: "glob"

  parquet:
    required_columns: ["wgt_nominal", "njets_nominal", "nBtagLoose_nominal", "nBtagMedium_nominal"]
    allow_missing_columns: false

  weights:
    weight_col: "wgt_nominal"
    use_in_loss: true
    normalize_in_batch: true

  cv:
    n_folds: 4
    strategy: "stratified"
    shuffle: true

samples:
  # base path comes from CLI. This is only the template.
  # available tokens: {BASE}, {PROCESS}
  glob_template: "{BASE}/{PROCESS}/*/*.parquet"

  signal:
    label: 1
    processes: ["vbf_powheg_dipole"]

  background:
    label: 0
    groups:
      DY:
        processes: ["dyTo2Mu_MLL_10To50", "dyTo2Mu_MLL_50To120", "dyTo2Mu_MLL_120To200"]
      TOP:
        processes: ["ttjets_dl", "ttjets_sl"]
      EWK:
        processes: ["ewk_lljj"]

features:
  training:
    - "dimuon_mass"
    - "dimuon_pt"
    - "dimuon_pt_log"
    - "dimuon_rapidity"
    - "dimuon_ebe_mass_res"
    - "dimuon_ebe_mass_res_rel"
    - "dimuon_cos_theta_cs"
    - "dimuon_phi_cs"
    - "jet1_pt_nominal"
    - "jet1_eta_nominal"
    - "jet1_phi_nominal"
    - "jet2_pt_nominal"
    - "jet2_eta_nominal"
    - "jet2_phi_nominal"
    - "jj_mass_nominal"
    - "jj_mass_log_nominal"
    - "jj_dEta_nominal"
    - "nsoftjets5_nominal"
    - "htsoft2_nominal"
    - "rpt_nominal"
    - "ll_zstar_log_nominal"
    - "mmj_min_dEta_nominal"
    - "pt_centrality_nominal"
    - "year"

preprocessing:
  scaler:
    type: "standard"

model:
  kind: "mlp"
  hidden: [512, 154, 72]
  activation: "gelu"
  dropout: [0.28745, 0.28745, 0.28745]
  batch_norm: true
  output:
    returns_logits: true

training:
  epochs: 50
  batch_size: 8192

  dataloader:
    num_workers: 0
    prefetch_factor: null     # must be null if num_workers == 0
    pin_memory: false         # will be auto-forced false on CPU

  optimizer:
    name: "adamw"
    lr: 0.0012674497884
    weight_decay: 3.9122e-06
    betas: [0.9, 0.999]
    eps: 1.0e-08

  scheduler:
    name: "reduce_on_plateau"
    reduce_on_plateau:
      mode: "min"
      factor: 0.5
      patience: 2
      min_lr: 1.0e-6
      threshold: 1.0e-4

  loss:
    name: "bce_logits"
    bce_logits:
      pos_weight: null
      label_smoothing: 0.0

  regularization:
    gradient_clip_norm: 5.0
    amp:
      enable: true

early_stopping:
  enable: true
  monitor: "val_loss" # "val_auc_weighted"
  mode: "min"
  patience: 5
  min_delta: 1.0e-4
  warmup_epochs: 3
  restore_best: true

metrics:
  weighted:
    auc: true
    pr: true
    ks_overtraining: true
    calibration: true
    threshold_scan: true
    significance: true
  significance:
    definition: "S/sqrt(B)"
    signal_processes: ["vbf_powheg_dipole"]

plots:
  enable: true
  out_subdir: "plots"
  score_hist:
    bins: 30
    range: [0.0, 1.0]
    normalize: true
    logy: false
  roc:
    points: 300
  calibration:
    n_bins: 10
  corr:
    topk: 30

artifacts:
  save_best_model: true
  save_last_model: true
  save_scaler: true
  save_fold_npz: true
  save_history: true
  save_predictions: false
