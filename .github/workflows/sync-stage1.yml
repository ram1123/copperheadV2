name: Stage1 Sync Check

on:
  push:
    branches: [ main, dev_run3_2022_2023 ]
    paths:
      - "run_stage1.py"
      - "src/**"
      - "data/**"
      - "modules/**"
      - "configs/**"
      - "scripts/sync_parquet_dimuon.py"
      - "stage1_loop_Improved.sh"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "run_stage1.py"
      - "src/**"
      - "data/**"
      - "modules/**"
      - "configs/**"
      - "scripts/sync_parquet_dimuon.py"
      - "stage1_loop_Improved.sh"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/**"  
  workflow_dispatch:

jobs:
  sync-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CONDA_OVERRIDE_CUDA: "12.0"
      ENABLE_DASK_REPORT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
          cache-write: true

      - name: Cache pixi files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rattler
            ~/.pixi
            .pixi
          key: ${{ runner.os }}-pixi-${{ hashFiles('pixi.lock') }}
          restore-keys: |
            ${{ runner.os }}-pixi-

      - name: Install pixi env
        run: |
          pixi install --locked -e ci

      - name: Show pixi environment info
        run: |
          pixi run -e ci python --version
          pixi run -e ci python -c "import sys; print(sys.executable)"

      - name: Create output directories
        run: |
          mkdir -p test/output
          mkdir -p test/reference

      # STEP-1: Get the stage-1 output
      - name: Run stage-1 sync sample
        run: |
          pixi run -e ci  bash -lc '
            set -euo pipefail
            time bash stage1_loop_Improved.sh \
              -c configs/datasets/sync_dataset_nanoAODv12.yaml \
              -v 12 \
              -l dev_March26_week3 \
              -y "2022preEE" \
              -m 1 \
              -z \
              -S test/output
          '

      # STEP-2: Get the sync text files
      - name: Produce sync text files
        run: |
          pixi run -e ci  bash -lc '
            set -euo pipefail

            python scripts/sync_parquet_dimuon.py \
              test/output/dev_March26_week3/stage1_output/2022preEE/f1_0/data_D/0/ \
              -o test/output/dev_March26_week3/stage1_output/2022preEE_dataD_eventKinematics.txt

            python scripts/sync_parquet_dimuon.py \
              test/output/dev_March26_week3/stage1_output/2022preEE/f1_0/dyTo2L_M-50_incl/0/ \
              -o test/output/dev_March26_week3/stage1_output/2022preEE_dy_eventKinematics.txt

            python scripts/sync_parquet_dimuon.py \
              test/output/dev_March26_week3/stage1_output/2022preEE/f1_0/vbf_powheg_dipole/0/ \
              -o test/output/dev_March26_week3/stage1_output/2022preEE_vbf_eventKinematics.txt
          '

      # STEP-3: Compare the reference with new generated text file
      - name: Compare against references
        run: |
          pixi run -e ci  bash -lc '
            set -euo pipefail

            python scripts/sync_parquet_dimuon.py \
              test/reference/2022preEE_dataD_eventKinematics.txt \
              test/output/dev_March26_week3/stage1_output/2022preEE_dataD_eventKinematics.txt \
              -o diff_dataD_2022preEE.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/2022preEE_dy_eventKinematics.txt \
              test/output/dev_March26_week3/stage1_output/2022preEE_dy_eventKinematics.txt \
              -o diff_dy_2022preEE.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/2022preEE_vbf_eventKinematics.txt \
              test/output/dev_March26_week3/stage1_output/2022preEE_vbf_eventKinematics.txt \
              -o diff_vbf_2022preEE.csv
          '

      # STEP-4: Fail if any diff file is non-empty
      - name: Check diff outputs
        run: |
          set -euo pipefail

          fail=0
          for f in diff_dataD_2022preEE.csv diff_dy_2022preEE.csv diff_vbf_2022preEE.csv; do
            if [ ! -f "$f" ]; then
              echo "OK: $f not produced (treating as no differences)."
              continue
            else
              echo "ERROR: Non-empty diff found in $f"
              echo "----- $f -----"
              cat "$f"
              echo "---------------"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sync-stage1-artifacts
          path: |
            diff_dataD_2022preEE.csv
            diff_dy_2022preEE.csv
            diff_vbf_2022preEE.csv
            test/output/dev_March26_week3/stage1_output/2022preEE_dataD_eventKinematics.txt
            test/output/dev_March26_week3/stage1_output/2022preEE_dy_eventKinematics.txt
            test/output/dev_March26_week3/stage1_output/2022preEE_vbf_eventKinematics.txt
          if-no-files-found: warn
