name: Stage1 Sync Check

concurrency:
  group: sync-stage1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "run_stage1.py"
      - "src/**"
      - "data/**"
      - "modules/**"
      - "configs/**"
      - "scripts/sync_parquet_dimuon.py"
      - "scripts/update_sync_references.sh"
      - "stage1_loop_Improved.sh"
      - "run_analysis_pipeline.sh"
      - "common_workflow.sh"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "run_stage1.py"
      - "src/**"
      - "data/**"
      - "modules/**"
      - "configs/**"
      - "scripts/sync_parquet_dimuon.py"
      - "scripts/update_sync_references.sh"
      - "stage1_loop_Improved.sh"
      - "run_analysis_pipeline.sh"
      - "common_workflow.sh"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  sync-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: [2017, 2022preEE]
    env:
      # No CONDA_OVERRIDE_CUDA needed: pixi.toml scopes the CUDA requirement to
      # environments that include the "cuda" feature, and this workflow only
      # ever uses "ci" (which doesn't), so it resolves on GPU-less runners as-is.
      ENABLE_DASK_REPORT: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: ci
          cache: true
          cache-write: true

      - name: Install pixi env
        run: |
          pixi install --locked -e ci

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Show pixi environment info
        run: |
          pixi run -e ci python --version
          pixi run -e ci python -c "import sys; print(sys.executable)"

      - name: Create output directories
        run: |
          mkdir -p test/output

      - name: Apply CI-only switch overrides
        run: |
          cp configs/parameters/switches.yaml configs/parameters/switches.yaml.bak
          cp test/reference/switches.yaml configs/parameters/switches.yaml

      # STEP-1: Get the stage-1 output
      - name: Run stage-1 sync sample
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            time bash run_analysis_pipeline.sh \
              -c configs/datasets/sync_dataset_nanoAODv12.yaml \
              -v 12 \
              -l label_output \
              -y "${{ matrix.year }}" \
              -m 1 \
              -z \
              -S test/output
          '

      - name: Produce sync text files
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            python scripts/sync_parquet_dimuon.py \
              test/output/label_output/stage1_output/${{ matrix.year }}/f1_0/data_*/ \
              -o test/output/label_output/stage1_output/${{ matrix.year }}_data_eventKinematics.txt

            python scripts/sync_parquet_dimuon.py \
              test/output/label_output/stage1_output/${{ matrix.year }}/f1_0/dy*/0/ \
              -o test/output/label_output/stage1_output/${{ matrix.year }}_dy_eventKinematics.txt

            python scripts/sync_parquet_dimuon.py \
              test/output/label_output/stage1_output/${{ matrix.year }}/f1_0/vbf_powheg_dipole/0/ \
              -o test/output/label_output/stage1_output/${{ matrix.year }}_vbf_eventKinematics.txt
          '

      - name: Compare cutflow JSON against references
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            case "${{ matrix.year }}" in
              2017)
                data_sample="data_B"
                dy_sample="dy_M-50_aMCatNLO"
                ;;
              2022preEE)
                data_sample="data_D"
                dy_sample="dyTo2L_M-50_incl"
                ;;
              *)
                echo "Unsupported sync year for cutflow comparison: ${{ matrix.year }}" >&2
                exit 1
                ;;
            esac

            vbf_sample="vbf_powheg_dipole"
            year_root="test/output/label_output/stage1_output/${{ matrix.year }}/f1_0"

            echo "[debug] matrix.year=${{ matrix.year }}"
            echo "[debug] year_root=${year_root}"
            echo "[debug] data_sample=${data_sample}"
            echo "[debug] dy_sample=${dy_sample}"
            echo "[debug] vbf_sample=${vbf_sample}"

            for sample_dir in \
              "${year_root}/${data_sample}/0" \
              "${year_root}/${dy_sample}/0" \
              "${year_root}/${vbf_sample}/0"
            do
              echo "[debug] listing ${sample_dir}"
              if [ -d "${sample_dir}" ]; then
                find "${sample_dir}" -maxdepth 1 -type f | sort
              else
                echo "[debug] directory missing: ${sample_dir}"
              fi
            done

            find_cutflow_file() {
              local sample_dir="$1"
              local sample_name="$2"
              local matches=()

              while IFS= read -r path; do
                matches+=("$path")
              done < <(find "$sample_dir" -maxdepth 1 -type f -name "cutflow_${sample_name}_*.json" | sort)

              if [ "${#matches[@]}" -ne 1 ]; then
                echo "Expected exactly one cutflow JSON for ${sample_name} in ${sample_dir}, found ${#matches[@]}" >&2
                printf "%s\n" "${matches[@]}" >&2
                exit 1
              fi

              echo "[debug] selected cutflow for ${sample_name}: ${matches[0]}" >&2
              printf "%s\n" "${matches[0]}"
            }

            normalize_existing_path() {
              local raw_path="$1"
              local cleaned_path

              cleaned_path=$(printf "%s" "${raw_path}" | tr -d "\r\n")
              if [ ! -e "${cleaned_path}" ] && [[ "${cleaned_path}" == *.jsonn ]] && [ -e "${cleaned_path%n}" ]; then
                echo "[debug] repairing suspicious .jsonn suffix: ${cleaned_path} -> ${cleaned_path%n}" >&2
                cleaned_path="${cleaned_path%n}"
              fi

              if [ ! -e "${cleaned_path}" ]; then
                echo "[debug] normalized path does not exist: ${cleaned_path}" >&2
                exit 1
              fi

              realpath "${cleaned_path}"
            }

            data_cutflow=$(find_cutflow_file "${year_root}/${data_sample}/0" "${data_sample}")
            dy_cutflow=$(find_cutflow_file "${year_root}/${dy_sample}/0" "${dy_sample}")
            vbf_cutflow=$(find_cutflow_file "${year_root}/${vbf_sample}/0" "${vbf_sample}")
            data_cutflow=$(normalize_existing_path "${data_cutflow}")
            dy_cutflow=$(normalize_existing_path "${dy_cutflow}")
            vbf_cutflow=$(normalize_existing_path "${vbf_cutflow}")
            data_cutflow_ref=$(normalize_existing_path "test/reference/${{ matrix.year }}_cutflow_${data_sample}_0.json")
            dy_cutflow_ref=$(normalize_existing_path "test/reference/${{ matrix.year }}_cutflow_${dy_sample}_0.json")
            vbf_cutflow_ref=$(normalize_existing_path "test/reference/${{ matrix.year }}_cutflow_${vbf_sample}_0.json")

            echo "[debug] reference data cutflow: ${data_cutflow_ref}"
            echo "[debug] reference dy cutflow: ${dy_cutflow_ref}"
            echo "[debug] reference vbf cutflow: ${vbf_cutflow_ref}"
            echo "[debug] produced data cutflow: ${data_cutflow}"
            echo "[debug] produced dy cutflow: ${dy_cutflow}"
            echo "[debug] produced vbf cutflow: ${vbf_cutflow}"
            echo "[debug] using script: scripts/sync_parquet_dimuon.py"

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_cutflow_${data_sample}_0.json \
              "${year_root}/${data_sample}/0/cutflow_${data_sample}_0.json" \
              -o diff_cutflow_data_${{ matrix.year }}.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_cutflow_${dy_sample}_0.json \
              "${year_root}/${dy_sample}/0/cutflow_${dy_sample}_0.json" \
              -o diff_cutflow_dy_${{ matrix.year }}.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_cutflow_${vbf_sample}_0.json \
              "${year_root}/${vbf_sample}/0/cutflow_${vbf_sample}_0.json" \
              -o diff_cutflow_vbf_${{ matrix.year }}.csv
          '

      - name: Compare against references
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_data_eventKinematics.txt \
              test/output/label_output/stage1_output/${{ matrix.year }}_data_eventKinematics.txt \
              -o diff_data_${{ matrix.year }}.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_dy_eventKinematics.txt \
              test/output/label_output/stage1_output/${{ matrix.year }}_dy_eventKinematics.txt \
              -o diff_dy_${{ matrix.year }}.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_vbf_eventKinematics.txt \
              test/output/label_output/stage1_output/${{ matrix.year }}_vbf_eventKinematics.txt \
              -o diff_vbf_${{ matrix.year }}.csv
          '

      - name: Check diff outputs
        run: |
          set -euo pipefail

          fail=0
          {
            echo "## Stage1 sync summary for ${{ matrix.year }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for f in \
            diff_data_${{ matrix.year }}.csv \
            diff_dy_${{ matrix.year }}.csv \
            diff_vbf_${{ matrix.year }}.csv \
            diff_cutflow_data_${{ matrix.year }}.csv \
            diff_cutflow_dy_${{ matrix.year }}.csv \
            diff_cutflow_vbf_${{ matrix.year }}.csv
          do
            if [ ! -f "$f" ]; then
              echo "OK: $f not produced."
              echo "- $f: not produced" >> "$GITHUB_STEP_SUMMARY"
              continue
            elif [ -s "$f" ]; then
              echo "ERROR: Non-empty diff found in $f"
              echo "----- $f -----"
              sed -n '1,40p' "$f"
              lines=$(wc -l < "$f" | tr -d ' ')
              if [ "$lines" -gt 40 ]; then
                echo "... truncated; full diff saved in workflow artifacts ..."
              fi
              echo "---------------"
              echo "- $f: FAIL (${lines} lines, see artifact)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "OK: $f exists and is empty."
              echo "- $f: OK" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-stage1-artifacts-${{ matrix.year }}
          path: |
            diff_data_${{ matrix.year }}.csv
            diff_dy_${{ matrix.year }}.csv
            diff_vbf_${{ matrix.year }}.csv
            diff_cutflow_data_${{ matrix.year }}.csv
            diff_cutflow_dy_${{ matrix.year }}.csv
            diff_cutflow_vbf_${{ matrix.year }}.csv
            only_in_*.txt
            test/output/label_output/stage1_output/${{ matrix.year }}_data_eventKinematics.txt
            test/output/label_output/stage1_output/${{ matrix.year }}_dy_eventKinematics.txt
            test/output/label_output/stage1_output/${{ matrix.year }}_vbf_eventKinematics.txt
            test/output/label_output/stage1_output/${{ matrix.year }}/_status/**
            log_*.txt
          if-no-files-found: warn
