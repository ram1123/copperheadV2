name: Stage1 Sync Check

concurrency:
  group: sync-stage1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "run_stage1.py"
      - "src/**"
      - "data/**"
      - "modules/**"
      - "configs/**"
      - "scripts/sync_parquet_dimuon.py"
      - "stage1_loop_Improved.sh"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "run_stage1.py"
      - "src/**"
      - "data/**"
      - "modules/**"
      - "configs/**"
      - "scripts/sync_parquet_dimuon.py"
      - "stage1_loop_Improved.sh"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  sync-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        year: [2017, 2022preEE]
    env:
      CONDA_OVERRIDE_CUDA: "12.0"
      ENABLE_DASK_REPORT: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
          cache-write: true

      - name: Install pixi env
        run: |
          pixi install --locked -e ci

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Show pixi environment info
        run: |
          pixi run -e ci python --version
          pixi run -e ci python -c "import sys; print(sys.executable)"

      - name: Create output directories
        run: |
          mkdir -p test/output

      # STEP-1: Get the stage-1 output
      - name: Run stage-1 sync sample
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            time bash stage1_loop_Improved.sh \
              -c configs/datasets/sync_dataset_nanoAODv12.yaml \
              -v 12 \
              -l label_output \
              -y "${{ matrix.year }}" \
              -m 1 \
              -z \
              -S test/output
          '

      - name: Produce sync text files
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            python scripts/sync_parquet_dimuon.py \
              
            ${{ matrix.year }}/f1_0/data_*/ \
              -o test/output/label_output/stage1_output/${{ matrix.year }}_data_eventKinematics.txt

            python scripts/sync_parquet_dimuon.py \
              test/output/label_output/stage1_output/${{ matrix.year }}/f1_0/dy*/0/ \
              -o test/output/label_output/stage1_output/${{ matrix.year }}_dy_eventKinematics.txt

            python scripts/sync_parquet_dimuon.py \
              test/output/label_output/stage1_output/${{ matrix.year }}/f1_0/vbf_powheg_dipole/0/ \
              -o test/output/label_output/stage1_output/${{ matrix.year }}_vbf_eventKinematics.txt
          '

      - name: Compare against references
        run: |
          pixi run -e ci bash -lc '
            set -euo pipefail
            export PYTHONPATH="$PWD:${PYTHONPATH:-}"

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_data_eventKinematics.txt \
              test/output/label_output/stage1_output/${{ matrix.year }}_data_eventKinematics.txt \
              -o diff_data_${{ matrix.year }}.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_dy_eventKinematics.txt \
              test/output/label_output/stage1_output/${{ matrix.year }}_dy_eventKinematics.txt \
              -o diff_dy_${{ matrix.year }}.csv

            python scripts/sync_parquet_dimuon.py \
              test/reference/${{ matrix.year }}_vbf_eventKinematics.txt \
              test/output/label_output/stage1_output/${{ matrix.year }}_vbf_eventKinematics.txt \
              -o diff_vbf_${{ matrix.year }}.csv
          '

      - name: Check diff outputs
        run: |
          set -euo pipefail

          fail=0
          {
            echo "## Stage1 sync summary for ${{ matrix.year }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for f in \
            diff_data_${{ matrix.year }}.csv \
            diff_dy_${{ matrix.year }}.csv \
            diff_vbf_${{ matrix.year }}.csv
          do
            if [ ! -f "$f" ]; then
              echo "OK: $f not produced."
              echo "- $f: not produced" >> "$GITHUB_STEP_SUMMARY"
              continue
            elif [ -s "$f" ]; then
              echo "ERROR: Non-empty diff found in $f"
              echo "----- $f -----"
              sed -n '1,40p' "$f"
              lines=$(wc -l < "$f" | tr -d ' ')
              if [ "$lines" -gt 40 ]; then
                echo "... truncated; full diff saved in workflow artifacts ..."
              fi
              echo "---------------"
              echo "- $f: FAIL (${lines} lines, see artifact)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "OK: $f exists and is empty."
              echo "- $f: OK" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-stage1-artifacts-${{ matrix.year }}
          path: |
            diff_data_${{ matrix.year }}.csv
            diff_dy_${{ matrix.year }}.csv
            diff_vbf_${{ matrix.year }}.csv
            only_in_*.txt
            test/output/label_output/stage1_output/${{ matrix.year }}_data_eventKinematics.txt
            test/output/label_output/stage1_output/${{ matrix.year }}_dy_eventKinematics.txt
            test/output/label_output/stage1_output/${{ matrix.year }}_vbf_eventKinematics.txt
            test/output/label_output/stage1_output/${{ matrix.year }}/_status/**
            log_*.txt
          if-no-files-found: warn
