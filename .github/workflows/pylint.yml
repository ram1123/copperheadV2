name: Pylint (PR only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # needed for diff against base

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Run pylint on changed Python files in this PR
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"

        CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '\.py$' || true)

        if [ -z "$CHANGED_FILES" ]; then
          echo "No Python files changed in this PR. Skipping pylint."
          exit 0
        fi

        echo "Running pylint on:"
        echo "$CHANGED_FILES"

        pylint \
          --disable=import-error \
          --disable=missing-module-docstring \
          --disable=line-too-long \
          $CHANGED_FILES
