# filesystem base for hmm area
hmm_base: /work/projects/hmm
# hmm_base: /depot/cms/hmm
#  pattern of output folder:
# load_path=lambda wc: (
#     f"{HMM_BASE}/{HMM_USER}/hmm_ntuples/copperheadV1clean/"
#     f"{label_for_year_corr(wc.year)}/stage1_output/{wc.year}/f1_0"
# )

# what to run
years: ["2022preEE", "2022postEE", "2023", "2023BPix", "2024", "2025", "2026"]
years: ["2024"]

# run_tag: "FilterEvents_Aug30_tightPassLepVeto_OfficialRecomendation_MuonID-tightId"
# run_tag: "FilterJets_Aug30_tightPassLepVeto_DefaultjetPt25GeV"
# run_tag: "FilterJets_Aug30_tightPassLepVeto_DefaultjetPt25GeV_PUDNN"

# run_tag: "FilterEvents_Sep22_tightPassLepVeto_OfficialRecomendation_Systematics"
run_tag: "FilterEvents_Sep22_tightPassLepVeto_OfficialRecomendation"
# run_tag: "FilterEvents_Sep22_tightPassLepVeto_DefaultjetPt25GeV_PUDNN_JERStrat4"
# run_tag: "FilterJets_Sep22_tightPassLepVeto_DefaultjetPt25GeV_PUDNN"
# run_tag: "FilterJets_Sep22_tightPassLepVeto_DefaultjetPt25GeV"

# Optional standalone switches yaml, stage-1 only (see run_stage1.py's
# --switches-yaml / src/lib/get_parameters.py). Pins the `stage1` rule to a
# named, independent switches configuration -- e.g.
# configs/switches/switches_official.yaml -- instead of whatever
# configs/switches/switches_official.yaml currently says, so you don't have to edit
# the shared file in place per run_tag. 
# Can also be set per-invocation without editing this file:
#   snakemake ... --config switches_yaml=configs/switches/switches_official.yaml

switches_yaml: configs/switches/switches_official.yaml
# switches_yaml: configs/switches/switches_official_systematics.yaml

# switches_yaml: configs/switches/switches_JetPt25GeV.yaml
# switches_yaml: configs/switches/switches_JetPt25GeV_PUDNN.yaml
# switches_yaml: configs/switches/switches_official_Both_HEHF_50GeV.yaml
# switches_yaml: configs/switches/switches_JetPt25GeV_PUDNN_EventFilter_JetStrat4.yaml

# Optional: load the stage-2 VBF DNN from dnn/trained_models/<dnn_model_label>/
# instead of the current run_tag's label (default ""). Training output is unaffected.
dnn_model_label: "Run3_nanoAODv12_FilterEvents_Aug30_tightPassLepVeto_OfficialRecomendation_Systematics"
# dnn_model_label: ""

# Optional: years slug of the model dir to load, e.g. the combined-year model
# (dnn/trained_models/<label>/2022preEE-...-2026_h-peak_vbf_all). Empty = each stage2 job's own year.
dnn_model_years: ["2022preEE", "2022postEE", "2023", "2023BPix", "2024", "2025", "2026"]
# dnn_model_years: []

# Run stage2 / stage2_plot / stage3 with systematic variations (WITH_VARIATIONS=1).
# false = nominal only, outputs get a _NoSyst suffix.
with_variations: false

# Output-dir postfix for stage2 / stage2_plot / stage3 (the -o flag of run_analysis_pipeline.sh).
# Empty = the date the snakemake command starts (e.g. Sep29_2026). Set it explicitly to point
# stage2_plot/stage3 at a stage-2 output from an earlier day, or when resuming a run on a later day.
save_postfix: ""

# Dijet |eta| phase space for stage2 / stage2_plot / stage3 (JJ_ETA_REGION): "all" or one of
# modules/selection.py's PAIR_JJ_ETA_REGIONS (jj_both_central, jj_non_central, ...). Also selects the
# DNN model dir <years>_h-peak_vbf_<jj_eta_region>. Non-"all" regions get their own state/log names.
jj_eta_region: "all"

# DY split in stage-2 (DY_MATCHED_JETS): "" / "gen_2j" = DY_matched01J/2J on >=2 gen jets;
# "reco_012" = DY_recoMatched0J/1J/2J by how many of the two VBF reco jets are gen-matched,
# one free rateParam each. Stage-3 detects it from the histograms. Use a new save_postfix.
dy_matched_jets: ""

# true: stage3 rescales the signal from BR(H->mumu) = 2.6e-4 (stage-1 before the dataset-YAML fix) and
# writes to <save_postfix>_SigXS; stage3_validate / stats then read that directory.
signal_xsec_rescale: false

# Several regions in one DAG (stage23_all / stats_all run one stage2->stage3->stats chain each).
# [] = just jj_eta_region above.
# jj_eta_regions: ["all", "jj_both_central", "jj_one_fwd25_one_central", "jj_both_fwd25"]
jj_eta_regions: []

# Mutually exclusive regions the stats_all target combines into one multi-channel card (stats modes
# 12-14; never jj_non_central together with the forward regions). [] = no combination.
# jj_combine_regions: ["jj_both_central", "jj_one_fwd25_one_central", "jj_both_fwd25"]
jj_combine_regions: []

# One label for every year's stage2 / stage2_plot / stage3 / stats instead of the per-year
# Run3_nanoAODv<12|15>_<run_tag>; required by the stats rules when the years map to different labels
# (the Run3 card combines per-year cards from one label dir). "" = per-year labels.
# stage23_label: "Run3_nanoAODv15_FilterEvents_Sep22_tightPassLepVeto_OfficialRecomendation_Systematics"
stage23_label: ""

# Stats rules (stats_all target, combine pixi env): years/pseudo-years for significance + limit
# ([] = all stage-3 years + Run3 when its component years are present) and for the expensive
# blinded impacts + likelihood scans ([] = Run3).
stats_years: []
scan_years: []
run_impacts: true
run_lhscan: true

# Stage-1 prestage JSON variant: "" = prestage_output/processor_samples_<year>_NanoAODv<v>.json;
# "LumiSplit" = the Summer24 MC split disjointly across 2024/2025/2026 by lumi (PC guideline: 2025+2026
# are one year sharing Summer24 MC with 2024) -- produced by scripts/split_prestage_by_year_lumi.py.
# prestage_tag: "LumiSplit"
prestage_tag: ""

# dask gateway
use_gateway: true
cluster_index: 0

# Delete the raw stage-1 f1_0 output for a year once its compacted output has
# been written AND validated by scripts/compact_sanity_check.py (row/size
# checks passing). Off by default since this is irreversible; f1_0 is kept
# forever otherwise (compaction never deletes it on its own). Only takes
# effect for the Snakemake-driven stage1Compact rule.
cleanup_f1_0_after_compact: true

# plotting workflow
plot_vbf_filter_study: true

# Categories to generate validation plots for (subset of "nocat"/"vbf"/"ggh").
# "nocat" = fully inclusive (no VBF/ggH/btag category cut, just the mass-region
# selection) -- see modules/selection.py's prod_cat_cut for "nocat" vs "vbf"/"ggh".
# plot_categories: ["vbf", "ggh"]
# plot_categories: ["nocat", "vbf", "ggh"]
plot_categories: ["vbf"]
# plot_categories: ["nocat"]   # inclusive plots only, no vbf/ggh categorization

# Which njets_plot bins to produce, per non-vbf category (vbf is always
# njets>=2 by construction, not configurable here -- see plot_jj_eta_regions).
# Each value is a list drawn from "inclusive"/"0"/"1"/"2" ("2" = >=2 jets).
# A category listed in plot_categories but absent from this map defaults to
# ["inclusive"] (a single inclusive overview plot -- the historical default).
plot_njets_plots:
  vbf: ["inclusive"]
  # ggh: ["inclusive"]
  # nocat: ["inclusive"]
  ggh: ["inclusive", "0", "1", "2"]  
  nocat: ["inclusive", "0", "1", "2"]  
# plot_njets_plots:
#   ggh: ["0"]                    # only the zero-jet bin
#   ggh: ["inclusive"]            # only the plain inclusive overview
#   ggh: ["0", "1", "2"]          # full njets multiplicity split, no inclusive overview
#   ggh: ["inclusive", "0", "1", "2"]   # overview plus the full split

# Two-jet (pair) dijet-eta topology options, used for vbf's njets>=2 plots,
# and for the "2" (>=2j) bin of any category's plot_njets_plots above
# (ggh/nocat otherwise only produce the inclusive/"all" overview and don't
# split by dijet-eta region -- see _jet_region_targets_for in the Snakefile).
# Mirrors (not imported) modules/selection.py::PAIR_JJ_ETA_REGIONS.
# plot_jj_eta_regions: ["all"]
# plot_jj_eta_regions: ["all", "jj_both_central", "jj_both_fwd25", "jj_one_fwd25_one_central"]
plot_jj_eta_regions: ["all", "jj_both_central", "jj_both_fwd25", "jj_one_fwd25_one_central", "jj_non_central"]
# plot_jj_eta_regions: ["all", "jj_both_central", "jj_non_central", "jj_one_fwd25_one_central", "jj_one_he_one_central", "jj_one_fwd30_one_central", "jj_both_fwd25", "jj_both_he", "jj_both_fwd30", "jj_one_he_one_fwd30"]

# Single-jet dijet-eta topology options, used for the "1" (1j) bin of any
# category's plot_njets_plots above (otherwise unused). Empty means the 1j
# bin gets a single "all"-region plot instead of a region split. Mirrors
# modules/selection.py::SINGLE_JET_ETA_REGIONS.
plot_single_jet_eta_regions: []
# plot_single_jet_eta_regions: ["single_central", "single_fwd25", "single_he", "single_fwd30"]

# Z-pT weighting variants to plot.
# plot_zpt_modes: ["withzpt"]
plot_zpt_modes: ["withzpt", "nozpt"]

# Variable-set size to plot.
plot_var_sets: ["fullset"]
# plot_var_sets: ["minset", "fullset"]

# Extra VAR_SETS group(s) (configs/variables/variable_lists.py) to plot IN
# ADDITION to the default set -- passed through to validation_plotter_unified.py's
# -var/--variables flag. Empty means default-only (no extra groups).
# plot_extra_variables: []
plot_extra_variables: ["jet_id"]

# Suffix appended to the plot output directory name (label_for_year(year) +
# suffix). Change this when rerunning the plotter under the same run_tag with
# different settings, so it writes to a separate directory instead of
# overwriting the main run's plots. "" writes directly to label_for_year(year)/.
# plot_output_suffix: "_DY_ReRun"
# plot_output_suffix: "_UpdatedBins"
plot_output_suffix: ""

# zpt DNN
zpt:
  outbase: "zpt_wgt_dnn"
  max_events: 3000000
  batch: 65536
