  DISCO-mass-decorrelation:
    title: DisCo decorrelation penalty against m_mumu
    problem: The transformer receives both muon four-vectors, so m_mumu is recoverable from the mu1/mu2 tokens and from the
      (mu1, mu2) pairwise invariant mass. Setting the dimuon token mass to 0 hides nothing. A score that learns m_mumu sculpts
      the background mass spectrum, which is fatal for a bump hunt at 125 GeV.
    change: total_loss = weighted_cross_entropy + lambda * dCorr^2(score, m_mumu), evaluated on background events per batch
      with the per-event training weights. lambda defaults to 0.0.
    files:
    - src/disco.py
    - src/losses.py
    - src/features.py
    - src/data.py
    - scripts/train.py
    - scripts/validate_model.py
    - configs/study_config.yaml
    default_lambda: 0.0
    score_mode: signal_sum
    target_class_index: 2
    monitor_when_disabled: true
    evidence:
      mass_recoverable_from_inputs:
        n_background_events: 2000
        dcorr_mass_vs_mu1mu2_pair_mass_feature: 0.9576212167739868
        dcorr_mass_vs_dimuon_token_energy: 0.20202220976352692
        note: The (mu1, mu2) pairwise invariant-mass feature reproduces m_mumu almost exactly, which is why setting the dimuon
          token mass to 0 does not decorrelate anything and why a penalty (or an input-basis change) is required.
