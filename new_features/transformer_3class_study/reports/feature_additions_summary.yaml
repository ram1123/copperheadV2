known_issues_remaining:
- The deeper BatchNorm1d(hidden) layers inside PairEmbed still see degenerate entries; with the input masked those collapse
  to a constant (the conv bias) rather than a kinematics-dependent signal. Fully masked statistics throughout PairEmbed were
  out of scope.
- InputProcess applies RMSNorm across the 5-dim feature axis, partially undoing the per-feature standardization.
- m_mumu is still reconstructible from the inputs; the DisCo term penalizes using it rather than removing it. A Collins-Soper
  input-basis change would remove it outright.
- Normalization statistics are pooled across the heterogeneous token types.
- checkpoint_payload in scripts/train.py has unreachable plotting code after its return.
