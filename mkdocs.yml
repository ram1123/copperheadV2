site_name: CopperheadV2 Documentation
site_url: https://ram1123.github.io/copperheadV2/
repo_url: https://github.com/ram1123/copperheadV2
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site

# Keep scratch notes out of the built site.
exclude_docs: |
  api/SUMMARY.md
  temp/

# Rewrites ../<repo path> links in the docs to GitHub links at build time.
hooks:
    - scripts/mkdocs_hooks.py

theme:
    name: material
    icon:
        logo: material/snake
        repo: fontawesome/brands/github
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: deep orange
          accent: amber
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: deep orange
          accent: amber
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.indexes
        - navigation.top
        - navigation.footer
        - toc.follow
        - search.highlight
        - search.suggest
        - content.code.copy
        - content.action.edit

plugins:
    - search
    # API Reference: one page per module under src/, modules/, cli/ (scripts/gen_api_docs.py).
    - gen-files:
          scripts:
              - scripts/gen_api_docs.py
    - literate-nav:
          nav_file: SUMMARY.md
    - section-index
    - mkdocstrings:
          handlers:
              python:
                  # Extra paths load namespace folders (no __init__.py) as top-level packages.
                  paths: [., src, src/lib, src/copperhead/zpt_rewgt/derive]
                  options:
                      show_source: true
                      show_if_no_docstring: true
                      show_signature_annotations: true
                      separate_signature: true
                      members_order: source
                      heading_level: 2
                      show_symbol_type_heading: true
                      show_symbol_type_toc: true
                      docstring_section_style: list
                      merge_init_into_class: true
                      # Docstrings here are informal; don't warn about missing types/params.
                      docstring_options:
                          warn_unknown_params: false
                          warn_missing_types: false

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - tables
    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.snippets:
          base_path: docs
    - pymdownx.arithmatex:
          generic: true

# Render $...$ LaTeX (used in the selection tables) with MathJax.
extra_javascript:
    - javascripts/mathjax.js
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
    - Home: index.md
    - Getting Started:
          - Introduction and Setup: Introduction.md
          - Snakemake Workflow: workflow_management.md
          - Known Issues: known_issues.md
    - Pipeline:
          - Selection and Samples:
                - Run-3 Selection, Corrections and Samples: Run3_selection_and_samples.md
                - 2024 / 2025-26 Year Grouping and MC Split: Run3_2024_2025_2026_MC_split.md
                - Recommendations and Special Treatments: Official_recommendation.md
          - Corrections:
                - Z-pT Reweighting: ZpT_reweight.md
                - EBE Mass Resolution: eventbyeventMassResolution.md
                - HEM Veto Ratio: HemVetoRatio.md
          - Outputs:
                - Get Yields: GetYields.md
                - Plotting Codes: PlottingCodes.md
    - Analysis:
          - VBF:
                - DNN: DNN_VBF.md
                - Statistics Pipeline: Statistics.md
          - ggH:
                - Steps After Stage-1: ggH_steps_after_stage1_v2.md
                - Category Boundary Calculation: ggH_BdtCategoryEdgeCalculation.md
                - Validation Plots: ggH_validation.md
                - Datacard Generation: ggH_dataCardGeneration.md
    - Validation:
          - Cut Flow Cross Check Before PR: cut-flow_beforePR.md
          - 2024 Sync Ntuples: sync_2024_ntuples.md
    - Tools:
          - Failed Jobs Check: FailedJobsCheck.md
          - Merge NanoAOD ROOT Files: MergeNanoAODRootFiles.md
          - Copy /work to /store (EOS): CopyWorkToStore.md
          - Additional Scripts: Additional_Scripts.md
          - AF Status Pages: af_status_pages.md
    - Reference:
          - Run-2 Datasets: Run2DY_SamplesList.md
          - NanoAOD v12 vs v9: NanoAODv12_v9.md
          - API Reference: api/
          - TODO Summary: TODO_SUMMARY.md
          - Archive:
                - Hyeon's Notes: personal_notes.md
