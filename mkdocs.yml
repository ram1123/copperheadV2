site_name: CopperheadV2 Documentation
site_url: https://ram1123.github.io/copperheadV2/
repo_url: https://github.com/ram1123/copperheadV2
edit_uri: edit/dev_docs/

docs_dir: docs
site_dir: _site

theme:
    name: material
    features:
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.highlight

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  options:
                      show_source: true

markdown_extensions:
    - pymdownx.snippets:
          base_path: docs

nav:
    - Home: index.md
    - Introduction:
          - Introduction: Introduction.md
          - Basic Information: Run3_all_basic_Information.md

    - Running:
          - Get Yields: GetYields.md
          - Failed Jobs Check: FailedJobsCheck.md
    - Corrections:
          - Z-pT Reweighting: ZpT_reweight.md
          - EBE Mass Resolution: eventbyeventMassResolution.md
    - Analysis Channels:
        - ggH:
              - Category Boundary Calculation: ggH_BdtCategoryEdgeCalculation.md
              - Validation Plots: ggH_validation.md
              - Datacard Generation: ggH_dataCardGeneration.md
        - VBF:
              - DNN: DNN_VBF.md
    - Workflow Management:
            - Snakemake: workflow_management.md
    - Notes:
          - Datasets Info: datasets_info.md
          - NanoAOD v12 vs v9: NanoAODv12_v9.md
          - Known Issues: known_issues.md
    - Maintenance:
          - TODO Summary: TODO_SUMMARY.md
    - References:
          - References: copperhead_processor-reference.md
